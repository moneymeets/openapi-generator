name: CI
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 15

    env:
      DOCKER_REGISTRY: moneymeets/openapi-generator
      TAG: latest-test

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-qemu-action@v1
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm64

      - uses: docker/setup-buildx-action@v2

      - name: Build image
        run: docker buildx build --platform linux/amd64,linux/arm64 -t $DOCKER_REGISTRY:$TAG .

      - name: Login to DockerHub
        #if: github.ref == 'refs/heads/moneymeets-typescript-angular'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish image
        #if: github.ref == 'refs/heads/moneymeets-typescript-angular'
        run: docker push $DOCKER_REGISTRY:$TAG
